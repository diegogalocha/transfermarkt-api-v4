services:
  transfermarkt-api-v4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transfermarkt-api-v4
    ports:
      - "8100:8000"
    environment:
      - RATE_LIMITING_ENABLE=${RATE_LIMITING_ENABLE:-false}
      - RATE_LIMITING_FREQUENCY=${RATE_LIMITING_FREQUENCY:-2/3seconds}
      - TFMKT_BASE_URL=${TFMKT_BASE_URL:-https://tmapi.transfermarkt.technology}
      - TFMKT_TIMEOUT_SECONDS=${TFMKT_TIMEOUT_SECONDS:-15}
      - TFMKT_MAX_CONCURRENCY=${TFMKT_MAX_CONCURRENCY:-10}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-600}
      - CACHE_REFERENCE_TTL_SECONDS=${CACHE_REFERENCE_TTL_SECONDS:-86400}
      - CACHE_MAX_ENTRIES=${CACHE_MAX_ENTRIES:-2000}
    restart: unless-stopped
